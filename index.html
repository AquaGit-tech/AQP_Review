<style>
  /* UI = pleisterdikte-calculator: zwarte pagina, één kaart met ronde hoeken, verticaal gecentreerd.
     Kop-iconen zonder cirkel + licht/donker = de andere calculators (body.dark-mode, localStorage "theme", standaard licht).
     Donker: kaart #1a1b1e en QR omgekeerd (wit op donker). Logo groot in de kop i.p.v. titel; logo en badge lijnen uit
     op de QR-modules (binnen de stille zone van 4/45), de badge komt nooit buiten de QR (Wim 14/10). */
  :root {
    --page: #000000;
    --primary: #33b2d2;
    --text-muted: #718096;
    --card: #ffffff;
    --qr-d: #000000;
    --inzet: calc(100% * 4 / 45);
    color-scheme: light;
  }
  body.dark-mode {
    --text-muted: #a0a0a0;
    --card: #1a1b1e;
    --qr-d: #ffffff;
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--page);
    color: var(--text-muted);
    min-height: 100vh;
    padding: 4px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    max-width: 500px;
    width: 100%;
    padding: 8px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding-left: var(--inzet); }
  .header-logo { flex: 1; min-width: 0; padding-top: 6px; }
  .header-logo img { display: block; width: 100%; max-width: 250px; height: auto; }
  .logo-dark { display: none !important; }
  body.dark-mode .logo-light { display: none !important; }
  body.dark-mode .logo-dark { display: block !important; }
  .header-controls { display: flex; align-items: center; gap: 2px; }
  .header-btn {
    background: transparent;
    border: none;
    min-width: 36px;
    min-height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .header-btn svg {
    width: 18px;
    height: 18px;
    stroke: var(--text-muted);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.2s;
  }
  @media (hover: hover) and (pointer: fine) { .header-btn:hover svg { stroke: var(--primary); } }
  .header-btn.btn-flash svg { stroke: var(--primary); transition: none; }
  .header-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; border-radius: 6px; }

  .qr { display: block; width: 100%; background: var(--card); border: 0; padding: 0; cursor: pointer; }
  .qr:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .segno { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }
  .segno path:first-child { fill: var(--card); }
  .segno .qrline { stroke: var(--qr-d); }

  .badge { display: block; margin-inline: var(--inzet); margin-top: -2px; padding-bottom: calc(var(--inzet) / 2); }
  .badge img { display: block; width: 100%; max-width: 100%; height: auto; }
  .badge:focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }

  /* Vaste ruimte (2 regels) onder de badge: de melding verschijnt erin zonder dat de kaart van grootte verandert (Wim 14/10) */
  .melding {
    font-size: 14px; line-height: 1.4; height: 40px; overflow: hidden; margin-inline: var(--inzet); margin-bottom: 4px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    visibility: hidden;
  }
  .melding.toon { visibility: visible; }
  .melding.link { font-size: 12px; word-break: break-all; user-select: all; }

  /* Schermvullend: enkel de QR, kleuren van het thema */
  .vol {
    position: fixed; inset: 0; z-index: 10;
    background: var(--card);
    display: flex; align-items: center; justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    cursor: zoom-out;
  }
  .vol .segno { width: min(100%, 86vh); }
</style>

<script>
(function () {
  var LINK = "https://search.google.com/local/writereview?placeid=ChIJKVqJe4OOw0cR2QE5ilRTQwY";
  var ZON = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
  var MAAN = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  var body = document.body;
  var icoon = document.getElementById("theme-icon");
  var vol = document.getElementById("vol");
  var melding = document.getElementById("melding");

  function flits(btn) {
    btn.classList.add("btn-flash");
    if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
    setTimeout(function () { btn.classList.remove("btn-flash"); }, 500);
  }

  // Thema exact zoals de calculators: body.dark-mode + localStorage "theme"
  function zetThema(donker) {
    body.classList.toggle("dark-mode", donker);
    icoon.innerHTML = donker ? ZON : MAAN;
  }
  try { if (localStorage.getItem("theme") === "dark") zetThema(true); } catch (e) {}
  document.getElementById("theme-toggle-btn").addEventListener("click", function () {
    var donker = !body.classList.contains("dark-mode");
    zetThema(donker);
    try { localStorage.setItem("theme", donker ? "dark" : "light"); } catch (e) {}
    flits(this);
  });

  function open() {
    vol.hidden = false;
    var d = document.documentElement;
    if (d.requestFullscreen) { d.requestFullscreen().catch(function () {}); }
  }
  function sluit() {
    vol.hidden = true;
    if (document.fullscreenElement && document.exitFullscreen) { document.exitFullscreen().catch(function () {}); }
  }
  document.getElementById("vol-btn").addEventListener("click", function () { flits(this); open(); });
  vol.addEventListener("click", sluit);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !vol.hidden) sluit(); });

  // Scherm blijft aan zolang de pagina open is
  function houdAan() {
    if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
    navigator.wakeLock.request("screen").catch(function () {});
  }
  document.addEventListener("visibilitychange", houdAan);
  houdAan();

  // Link sturen: deelmenu van de gsm (sms, WhatsApp, mail); anders kopiëren
  var verberg = null;
  function meld(t, isLink) {
    melding.textContent = t;
    melding.classList.toggle("link", !!isLink);
    melding.classList.add("toon");
    clearTimeout(verberg);
    verberg = setTimeout(function () { melding.classList.remove("toon"); }, isLink ? 20000 : 6000);
  }
  document.getElementById("deel-btn").addEventListener("click", function () {
    flits(this);
    if (navigator.share) {
      navigator.share({ title: "Review Aquaproved", text: "Via deze link schrijft u uw review over Aquaproved op Google:", url: LINK })
        .catch(function (e) { if (e && e.name !== "AbortError") kopieer(); });
    } else { kopieer(); }
  });
  function kopieer() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(LINK)
        .then(function () { meld("Link gekopieerd. Plak hem in een sms of WhatsApp."); })
        .catch(selecteer);
    } else { selecteer(); }
  }
  // kopiëren geweigerd: de link zelf verschijnt geselecteerd in dezelfde ruimte (kopieer via het gsm-menu)
  function selecteer() {
    meld(LINK, true);
    var r = document.createRange(); r.selectNodeContents(melding);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
})();
